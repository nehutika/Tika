<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}

.vcap{position:absolute;left:14px;right:80px;bottom:16px;color:#fff;text-shadow:0 1px 6px #000}.vcap p{margin:2px 0 0}
.vside{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:12px}.vside button{border:0;background:rgba(0,0,0,.4);color:#fff;border-radius:50%;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px}
.vside .on{color:var(--acc)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:100px}
.btn{border:0;background:var(--acc);color:#fff;font-weight:800;border-radius:14px;padding:11px 18px}.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.lnk{border:0;background:none;color:var(--mute);text-decoration:underline}
.auth{padding:40px 22px;display:grid;gap:10px;align-content:start}.auth h1{font-size:40px;margin:0 0 8px;text-align:center;letter-spacing:-.04em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;font-weight:600}.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.er{color:var(--acc);margin:0;min-height:1.2em;font-weight:600}.er.ok{color:#2E9E5B}
.empty{padding:48px 28px;text-align:center;color:var(--mute)}.empty b{display:block;color:var(--ink);font-size:18px}
.pfh{display:flex;align-items:center;gap:16px;padding:18px 16px 6px}.stats{display:flex;flex:1;justify-content:space-around;text-align:center}.stats b{display:block;font-size:20px}.stats small{color:var(--mute)}
.pfb{padding:4px 16px 12px;display:grid;gap:6px}.pfb h2{margin:0}.pfb div{display:flex;gap:8px;flex-wrap:wrap}
.sheet{position:fixed;inset:0;background:rgba(35,32,27,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;display:grid;gap:10px;animation:up .22s ease-out}

.ph-h{display:flex;justify-content:space-between;align-items:center}.srow{display:flex;justify-content:space-between;align-items:center;gap:12px}.srow small{display:block;color:var(--mute)}
.sw{width:48px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}.sw.on{background:var(--acc)}.sw.on:after{transform:translateX(20px)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#toast.on{opacity:1}
.wb{border:0;background:none;display:flex;align-items:center;gap:8px;padding:0;text-align:left}.tg{border:0;background:none;color:var(--acc);padding:0;font:inherit}.sb{padding:10px 14px}.row{display:flex;align-items:center;gap:10px;border:0;background:none;width:100%;padding:8px 14px;text-align:left}.seg.pt{grid-template-columns:repeat(3,1fr);padding:0 16px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.ib[hidden]{display:none}main{touch-action:pan-y}
nav button[aria-current="true"] .i{fill:currentColor;fill-opacity:.15}
.sheet.fs{align-items:stretch}.panel.full{height:100%;max-height:100%;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top,0px));align-content:start}
.sb{position:sticky;top:0;z-index:2;background:var(--bg)}.sb input{border-radius:999px;height:38px;padding:6px 16px}
.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}.vt{border:0;padding:0;aspect-ratio:9/16;background:#000;border-radius:10px;overflow:hidden}
.seg.pt{grid-template-columns:repeat(4,1fr)}.seg.pt button{font-size:12px;padding:8px 2px}
.acts{justify-content:space-between}.acts .on[data-r="dislike"],.acts .on[data-r="save"]{color:#2F6BDB}.acts .on[data-r="repost"]{color:#0E9F8C}
html,body{overflow-x:hidden}.ib{position:relative}
.dot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}.dot[hidden]{display:none}
nav{position:relative}nav button{transition:color .2s}
#ni{position:absolute;left:0;top:0;width:33.3334%;height:100%;display:flex;justify-content:center;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}#ni:after{content:"";width:30px;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.seg.pt{position:relative;--i:0}.seg.pt:after{content:"";position:absolute;bottom:2px;left:16px;width:calc((100% - 32px)/4);height:3px;border-radius:3px;background:var(--acc);transform:translateX(calc(var(--i)*100%));transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.seg button{transition:background .2s,color .2s,border-color .2s}
@keyframes sr{from{transform:translateX(28px);opacity:0}}@keyframes sl{from{transform:translateX(-28px);opacity:0}}
.nt{display:flex;gap:12px;align-items:center}.nt small{display:block;color:var(--mute)}.ng{margin:8px 0 0;font-size:13px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.un{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
.panel.chat{display:flex;flex-direction:column;gap:8px;overflow:hidden}
.ml{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.bb{max-width:78%;padding:8px 12px;border-radius:18px 18px 18px 6px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start;animation:up .18s ease-out}
.bb.me{align-self:flex-end;background:var(--acc);border-color:var(--acc);color:#fff;border-radius:18px 18px 6px 18px}

.cin{display:flex;gap:8px;align-items:center}
.row .pv{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .pv.bold{color:var(--ink);font-weight:600}.row .pv .i{width:14px;height:14px;vertical-align:-2px}
.mt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--mute)}
.bd{font-style:normal;background:var(--acc);color:#fff;border-radius:99px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:800}
.tkd{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
.mb{border:0;background:none;color:var(--mute);padding:4px;margin-left:4px;display:grid;place-items:center}
.rl{display:grid;gap:6px}.rl .btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mcard{border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:4px}.mb2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
a{color:var(--acc)}.rules p{margin:0 0 10px}.rules b{display:block}
.more{height:1px}
.sgl{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.sgc{flex:0 0 140px;border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:4px;justify-items:center;text-align:center}
.sgc b,.sgc small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;z-index:60;display:none}
.vid video{cursor:pointer}
.rules p{white-space:pre-line}
.skl{height:150px;margin:12px 0;border-radius:16px;background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:shm 1.3s linear infinite}
@keyframes shm{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.skl{animation:none}}
#off{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);background:#3A3631;color:#fff;text-align:center;padding:6px;font-size:13px;font-weight:700;z-index:70;display:none}
.boot{display:grid;place-items:center;height:60vh;font:800 36px system-ui,sans-serif;letter-spacing:-1px;color:var(--ink);opacity:.3}
